[project]
name = "retailx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rugved", email = "rugvedjadhao122004.dev@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastmcp>=4.1.4",
    "langchain>=1.4.7",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.1",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.scripts]
retailx = "retailx:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
